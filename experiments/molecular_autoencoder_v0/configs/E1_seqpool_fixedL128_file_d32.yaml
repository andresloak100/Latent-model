name: C_local_graph_L128_d32
data:
  processed_dir: data/processed_complex
  splits_file: data/splits_complex.json
  min_residues: 20
  max_residues: 400
  max_atoms: 3000
  tiers: {}
  curriculum: {}
model:
  d_model: 128
  n_heads: 4
  n_latent_tokens: 128
  latent_dim: 32
  enc_self_layers: 2
  dec_self_layers: 2
  ff_mult: 4
  dropout: 0.0
  max_res_pos: 1024
  coord_scale: 10.0
  max_chains: 16
  use_slot_emb: true
  dec_chain_aware: false
  dec_chain_emb: true
  dec_res_in_chain_emb: true
  dec_frames: false
  local_scale: 5.0
  unbounded_positions: true
  attn_window: 64
  attn_global: 4
  encoder_type: atomlatent
  k_neighbors: 8
  rope_freqs: 128
  rope_spherical: false
  objective: reconstruct
  flow_steps: 50
  group_self_layers: 0
  atom_self_layers: 0
  dec_cross_layers: 2
  dec_local_k: 8
  dec_local_layers: 2
  atom_addressing: group
  atom_bottleneck: seqpool
  seq_pool_fixed_L: 128
  seq_pool_order: file
loss:
  coord: 1.0
  distance: 1.0
  bond: 1.0
  clash: 0.5
  chirality: 0.2
  angle: 0.5
  local_distance: 1.0
  coarse: 1.0
train:
  seed: 0
  epochs: 900
  batch_size: 8
  lr: 0.0003
  weight_decay: 0.0
  grad_clip: 1.0
  log_every: 5
  eval_every: 25
  ckpt_every: 50
  clash_dist: 1.5
  loss_max_atoms: 3000
  out_dir: outputs/atomlatent_v1/C_local_graph_L128_d32
  overfit: false
  augment_rotation: true
  corrupt_frac: 0.0
  ema_decay: 0.9998
  mask_atom_frac: 0.0
  mask_region_frac: 0.0
  mask_region_span: 8
  mask_noise_std: 0.0
  report_symmetry_rmsd: true
  corrupt_mode: zero
