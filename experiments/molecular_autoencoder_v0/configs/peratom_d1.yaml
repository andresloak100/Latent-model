# Per-atom latents, protein identity featurisation (A/B arm).
#
# Tests whether the direct decoder's win survives dropping the per-residue slot
# bank for plain identity routing (output row i IS atom i). Identity inputs are
# unchanged from every other arm, so this isolates ROUTING GRANULARITY alone.
#
# Budget note: latent_dim is floats PER ATOM, so compression is exactly
# 3/latent_dim = 3.0x here -- close to direct_d8's 2.9x, which makes this the
# budget-matched comparison. latent_dim >= 3 is not compression at all.

name: peratom_d1

data:
  processed_dir: data/processed
  splits_file: data/splits.json
  min_residues: 20
  max_residues: 200
  max_atoms: 800

model:
  d_model: 128
  n_heads: 4
  n_latent_tokens: 16       # unused by encoder_type: direct
  latent_dim: 1             # floats PER ATOM -> 3x compression (see model_peratom.py)
  enc_self_layers: 2
  dec_self_layers: 2
  ff_mult: 4
  dropout: 0.0
  max_res_pos: 1024
  coord_scale: 10.0
  encoder_type: peratom
  k_neighbors: 8
  rope_freqs: 128
  rope_spherical: false
  objective: reconstruct
  flow_steps: 50

loss:
  coord: 1.0
  distance: 1.0
  bond: 1.0
  clash: 0.5
  chirality: 0.2

train:
  seed: 0
  epochs: 900
  batch_size: 16
  lr: 0.001
  weight_decay: 0.0
  grad_clip: 1.0
  log_every: 50
  eval_every: 300
  ckpt_every: 300
  clash_dist: 1.5
  out_dir: outputs/peratom_d1
  overfit: false
  augment_rotation: true
