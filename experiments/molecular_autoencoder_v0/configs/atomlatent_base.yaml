# Base for the atom-level / arbitrary-shared-latent grid (arms A-D).
#
# What differs from every previous codec here: the latent is L x latent_dim
# REGARDLESS of structure size. L is set by the grid runner, not by the data.
#
# Cartesian is the baseline by requirement. Local-frame prediction
# (model.dec_frames) is available as an ablation and is deliberately OFF here.
# Full SE(3) equivariance is NOT in this experiment -- it is a second-stage
# test once arbitrary shared latents are shown to reconstruct at all.
name: atomlatent_base
data:
  processed_dir: data/processed_complex
  splits_file: data/splits_complex.json
  min_residues: 20
  max_residues: 400
  max_atoms: 3000
model:
  d_model: 128
  n_heads: 4
  n_latent_tokens: 64        # overridden per grid cell
  latent_dim: 16             # overridden per grid cell; 3 channels are the anchor
  enc_self_layers: 2         # LOCAL atom self-attention; atoms are never pooled
  dec_self_layers: 2
  dec_cross_layers: 2        # the previous arbitrary-latent arm ran this at 1
  dec_local_layers: 2
  dec_local_k: 8
  ff_mult: 4
  dropout: 0.0
  max_res_pos: 1024
  coord_scale: 10.0
  max_chains: 16
  use_slot_emb: true
  unbounded_positions: true  # L and N both unbounded; no 1024 cap
  attn_window: 64            # O(N.w) atom attention, never O(N^2)
  attn_global: 4
  encoder_type: atomlatent
  dec_local_cross: false     # arm switch
  dec_frames: false          # Cartesian baseline, per requirement 8
  objective: reconstruct
loss:
  coord: 1.0
  distance: 1.0
  bond: 1.0
  clash: 0.5
  chirality: 0.2
  angle: 0.5                 # bond angles -- lengths alone leave joints free
  local_distance: 1.0        # k-nearest-neighbour distances, not uniform pairs
train:
  seed: 0
  epochs: 900
  batch_size: 8
  lr: 0.0003
  weight_decay: 0.0
  grad_clip: 1.0
  log_every: 25
  eval_every: 25
  ckpt_every: 50
  clash_dist: 1.5
  loss_max_atoms: 3000
  out_dir: outputs/atomlatent_base
  overfit: false
  augment_rotation: true
  ema_decay: 0.9998
  # Arm D only; the grid runner sets these.
  mask_atom_frac: 0.0
  mask_region_frac: 0.0
  mask_region_span: 8
  mask_noise_std: 0.0
