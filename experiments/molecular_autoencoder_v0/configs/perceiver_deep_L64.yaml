# DEPTH-MATCHED retry of the perceiver-direct architecture.
#
# The first 8-arm sweep failed at 9.2-10.5 A across every L (including an
# OVER-COMPLETE L256 latent), and train RMSD only reached ~2.4 A -- it could
# not fit the training set. That is an underfitting signature, and the sweep
# handicapped the decoder in two ways I specified badly:
#
#   1. dec_cross_layers = 1. One attention block had to BOTH locate a
#      residue's information in the latents AND decode it, versus the working
#      per-residue decoder's 2 refinement blocks with no retrieval to do.
#   2. group_self_layers = 0, disabled to protect O(N.L). But at R~78
#      residues R^2 = 6,084 -- 6.4x CHEAPER than the encoder's own N.L =
#      38,848. It only binds near 1M atoms (R^2 ~ 1.6e10). Disabling it here
#      bought nothing and cost depth.
#
# So: 4 cross-attention blocks interleaved with 2 group-refinement blocks,
# still no all-atom self-attention and still O(N.L) in atoms. If this also
# lands at ~9 A, the architecture is refuted on its merits and we stop.

data:
  max_atoms: 800
  max_residues: 200
  min_residues: 20
  processed_dir: data/processed
  splits_file: data/splits.json
loss:
  bond: 1.0
  chirality: 0.2
  clash: 0.5
  coord: 1.0
  distance: 1.0
model:
  atom_self_layers: 0
  coord_scale: 10.0
  d_model: 128
  dec_self_layers: 2
  dropout: 0.0
  enc_self_layers: 2
  encoder_type: perceiver_direct
  ff_mult: 4
  flow_steps: 50
  group_self_layers: 2
  k_neighbors: 8
  latent_dim: 8
  max_chains: 1
  max_res_pos: 1024
  n_heads: 4
  n_latent_tokens: 64
  objective: reconstruct
  rope_freqs: 128
  rope_spherical: false
  dec_cross_layers: 4
name: perceiver_deep_L64
train:
  augment_rotation: true
  batch_size: 16
  ckpt_every: 300
  clash_dist: 1.5
  epochs: 900
  eval_every: 300
  grad_clip: 1.0
  log_every: 50
  loss_max_atoms: 1200
  lr: 0.0003
  out_dir: outputs/perceiver/perceiver_deep_L64
  overfit: false
  seed: 0
  weight_decay: 0.0
