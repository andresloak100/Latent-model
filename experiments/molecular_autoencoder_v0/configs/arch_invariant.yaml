# Architecture A/B: identical to stage_b_heldout.yaml except the encoder is the
# SE(3)-invariant variant. Run this vs stage_b_heldout.yaml (baseline) at the
# same data scale to test whether an invariant encoder is more data-efficient.
name: arch_invariant

data:
  processed_dir: data/processed
  splits_file: data/splits.json
  min_residues: 20
  max_residues: 120
  max_atoms: 1200

model:
  d_model: 128
  n_heads: 4
  n_latent_tokens: 16
  latent_dim: 8
  enc_self_layers: 2
  dec_self_layers: 2
  ff_mult: 4
  dropout: 0.0
  max_res_pos: 1024
  coord_scale: 10.0
  encoder_type: invariant
  k_neighbors: 8

loss:
  coord: 1.0
  distance: 1.0
  bond: 1.0
  clash: 0.5
  chirality: 0.2

train:
  seed: 0
  epochs: 1000
  batch_size: 8
  lr: 0.001
  weight_decay: 0.0
  grad_clip: 1.0
  log_every: 50
  eval_every: 200
  ckpt_every: 200
  clash_dist: 1.5
  out_dir: outputs/arch_invariant
  overfit: false
