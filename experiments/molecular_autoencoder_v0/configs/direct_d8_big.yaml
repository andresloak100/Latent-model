name: direct_d8_big
data:
  processed_dir: data/processed_big
  splits_file: data/splits_big.json
  min_residues: 20
  max_residues: 400
  max_atoms: 3000
model:
  d_model: 128
  n_heads: 4
  n_latent_tokens: 16
  latent_dim: 8
  enc_self_layers: 2
  dec_self_layers: 2
  ff_mult: 4
  dropout: 0.0
  max_res_pos: 1024
  coord_scale: 10.0
  encoder_type: direct
  k_neighbors: 8
  rope_freqs: 128
  rope_spherical: false
  objective: reconstruct
  flow_steps: 50
loss:
  coord: 1.0
  distance: 1.0
  bond: 1.0
  clash: 0.5
  chirality: 0.2
train:
  seed: 0
  epochs: 900
  batch_size: 16
  lr: 0.001
  weight_decay: 0.0
  grad_clip: 1.0
  log_every: 50
  eval_every: 300
  ckpt_every: 300
  clash_dist: 1.5
  loss_max_atoms: 3000
  out_dir: outputs/direct_d8_big
  overfit: false
  augment_rotation: true
