# The winning Milestone-1 config: direct per-residue readout decoder.
#
# Held-out (293 folds, <=800-atom band): 0.754 A backbone / 1.020 A all-atom
# RMSD, chirality violation rate 0.001, bond error 0.161 A, contact F1 0.943,
# 2.9x compression. See REPORT.md section 1.
#
# The d1/d2/d4/d16 grid arms differ from this file ONLY in model.latent_dim
# (which for encoder_type: direct is floats *per residue*; n_latent_tokens is
# unused). The flow-matching arms differ only in objective: flowmatch -- and
# they fail badly (REPORT.md section 1.2), so do not enable it here casually.
name: direct_d8

data:
  processed_dir: data/processed
  splits_file: data/splits.json
  min_residues: 20
  max_residues: 200
  max_atoms: 800

model:
  d_model: 128
  n_heads: 4
  n_latent_tokens: 16       # unused by encoder_type: direct
  latent_dim: 8             # floats PER RESIDUE
  enc_self_layers: 2
  dec_self_layers: 2
  ff_mult: 4
  dropout: 0.0
  max_res_pos: 1024
  coord_scale: 10.0
  encoder_type: direct
  k_neighbors: 8
  rope_freqs: 128
  rope_spherical: false
  objective: reconstruct
  flow_steps: 50

loss:
  coord: 1.0
  distance: 1.0
  bond: 1.0
  clash: 0.5
  chirality: 0.2

train:
  seed: 0
  epochs: 900
  batch_size: 16
  lr: 0.001
  weight_decay: 0.0
  grad_clip: 1.0
  log_every: 50
  eval_every: 300
  ckpt_every: 300
  clash_dist: 1.5
  out_dir: outputs/direct_d8
  overfit: false
  augment_rotation: true
