# SIZE control for the architecture x data ladder.
#
# The ladder compares direct (1.1M) against perceiver (3.2M) and reads the
# val-vs-n SLOPE. But a 3x larger model memorises more at small n, so part of
# the perceiver's steeper expected slope would come from having more overfit
# to shed -- not from the architecture. That confounds the one number the
# experiment exists to measure.
#
# This row is the DIRECT codec at 3.8M (d_model 256), bracketing the
# perceiver's 3.2M from above, over the same rungs and budget. With direct at
# both 1.1M and 3.8M, the size contribution to the slope is measurable and
# can be subtracted rather than assumed away.

name: afdb1m_pretrain
data:
  processed_dir: data/processed_afdb1m
  splits_file: data/splits_afdb1m.json
  min_residues: 20
  max_residues: 110
  max_atoms: 800
model:
  d_model: 256
  n_heads: 8
  n_latent_tokens: 16
  latent_dim: 8
  enc_self_layers: 2
  dec_self_layers: 2
  ff_mult: 4
  dropout: 0.0
  max_res_pos: 1024
  coord_scale: 10.0
  encoder_type: direct
  k_neighbors: 8
  rope_freqs: 128
  rope_spherical: false
  objective: reconstruct
  flow_steps: 50
loss:
  coord: 1.0
  distance: 1.0
  bond: 1.0
  clash: 0.5
  chirality: 0.2
train:
  seed: 0
  # INBOX 93c. epochs is now an UPPER BOUND, not the budget. max_steps governs.
  # 972,849 structures at batch 16 = 60,803 steps/epoch; 1704 epochs was 103,608,418 steps against a
  # pre-registration expecting ~24,321. 100,000 is chosen as ~4x the pre-registered plateau
  # expectation, which is the headroom 88d needs to see whether more budget spreads the latent --
  # not a number that merely fits the wall.
  max_steps: 100000
  epochs: 4
  batch_size: 16
  lr: 0.0003
  weight_decay: 0.0
  grad_clip: 1.0
  log_every: 42
  eval_every: 85
  ckpt_every: 284
  clash_dist: 1.5
  loss_max_atoms: 1200
  out_dir: outputs/pretrain/afdb1m_pretrain
  overfit: false
  augment_rotation: true
