name: complex_scaled
data:
  processed_dir: data/processed_complex_scaled
  splits_file: data/splits_complex_scaled.json
  min_residues: 20
  max_residues: 400
  max_atoms: 3000
model:
  d_model: 128
  n_heads: 4
  n_latent_tokens: 16
  latent_dim: 8
  enc_self_layers: 2
  dec_self_layers: 2
  ff_mult: 4
  dropout: 0.0
  max_res_pos: 1024
  coord_scale: 10.0
  max_chains: 16
  use_slot_emb: true
  encoder_type: direct
  k_neighbors: 8
  rope_freqs: 128
  rope_spherical: false
  objective: reconstruct
  flow_steps: 50
  group_self_layers: 0
  atom_self_layers: 0
  dec_cross_layers: 1
loss:
  coord: 1.0
  distance: 1.0
  bond: 1.0
  clash: 0.5
  chirality: 0.2
train:
  seed: 0
  epochs: 3457
  batch_size: 8
  lr: 0.0003
  weight_decay: 0.0
  grad_clip: 1.0
  log_every: 25
  eval_every: 25
  ckpt_every: 50
  clash_dist: 1.5
  loss_max_atoms: 3000
  out_dir: outputs/complex_d8
  overfit: false
  augment_rotation: true
  corrupt_frac: 0.0
  corrupt_mode: zero
