name: ladder_direct_n450
data:
  processed_dir: data/processed_small
  splits_file: data/splits_small_n450.json
  min_residues: 20
  max_residues: 110
  max_atoms: 800
model:
  d_model: 128
  n_heads: 4
  n_latent_tokens: 16
  latent_dim: 8
  enc_self_layers: 2
  dec_self_layers: 2
  ff_mult: 4
  dropout: 0.0
  max_res_pos: 1024
  coord_scale: 10.0
  max_chains: 1
  encoder_type: direct
  k_neighbors: 8
  rope_freqs: 128
  rope_spherical: false
