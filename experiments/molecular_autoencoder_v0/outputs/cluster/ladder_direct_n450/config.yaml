loss:
  coord: 1.0
  distance: 1.0
  bond: 1.0
  clash: 0.5
  chirality: 0.2
train:
  seed: 0
  epochs: 8345
  batch_size: 16
  lr: 0.0003
  weight_decay: 0.0
  grad_clip: 1.0
  log_every: 208
  eval_every: 417
  ckpt_every: 1390
  clash_dist: 1.5
  loss_max_atoms: 1200
  out_dir: /network/scratch/j/jacob-junqi.tian/latent-model-workspace/results/ladder_direct_n450/run
  overfit: false
  augment_rotation: true
  corrupt_frac: 0.0
  corrupt_mode: zero
