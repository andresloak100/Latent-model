name: afdb1m_pretrain
data:
  processed_dir: data/processed_afdb1m
  splits_file: data/splits_afdb1m.json
  min_residues: 20
  max_residues: 110
  max_atoms: 800
  tiers: {}
  curriculum: {}
model:
  d_model: 256
  n_heads: 8
  n_latent_tokens: 16
  latent_dim: 8
  enc_self_layers: 2
  dec_self_layers: 2
  ff_mult: 4
  dropout: 0.0
  max_res_pos: 1024
  coord_scale: 10.0
  max_chains: 1
  use_slot_emb: false
  dec_chain_aware: false
  dec_chain_emb: true
  dec_res_in_chain_emb: true
  dec_frames: false
  local_scale: 5.0
  unbounded_positions: false
  attn_window: 0
  attn_global: 4
  encoder_type: direct
  k_neighbors: 8
  rope_freqs: 128
  rope_spherical: false
  objective: reconstruct
  flow_steps: 50
  group_self_layers: 0
  atom_self_layers: 0
  dec_cross_layers: 1
  dec_local_cross: false
  dec_local_k: 8
  dec_local_layers: 2
  atom_addressing: group
  atom_bottleneck: attention
  seq_pool_ratio: 8
  seq_pool_fixed_L: 0
  seq_pool_order: canonical
  latent_slot_norm: false
  fps_anchors: false
loss:
  coord: 1.0
  distance: 1.0
  bond: 1.0
  clash: 0.5
  chirality: 0.2
  angle: 0.0
  local_distance: 0.0
  coarse: 0.0
  load_balance: 0.0
train:
  seed: 0
  epochs: 4
  max_steps: 100000
  batch_size: 16
  lr: 0.0003
  weight_decay: 0.0
  grad_clip: 1.0
  log_every: 42
  eval_every: 85
  ckpt_every: 284
  clash_dist: 1.5
  loss_max_atoms: 1200
  out_dir: outputs/pretrain/afdb1m_pretrain
  overfit: false
  augment_rotation: true
  corrupt_frac: 0.0
  ema_decay: 0.0
  mask_atom_frac: 0.0
  mask_region_frac: 0.0
  mask_region_span: 8
  mask_noise_std: 0.0
  report_symmetry_rmsd: false
  corrupt_mode: zero
